:root{
  --red:#E2001A; --red-d:#B80015; --red-s:#FCE8EB;
  --slate:#5C6971; --slate-d:#3C464D; --ink:#1E2529; --muted:#66737B;
  --grey:#A5ABAF; --line:#E1E5E8; --fog:#F1F3F4;
  --ok:#2E7D5B; --ok-s:#E2F1E9; --warn:#8A5D00; --warn-s:#FFF3D1;
  --frame:#2A3236;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E4E7E9;color:var(--ink);font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
svg{flex:none}

.stage{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:22px 16px 40px;min-height:100vh}
.dev{display:flex;flex-direction:column;align-items:center;gap:12px}
.nr{display:flex;align-items:center;justify-content:space-between;width:360px;gap:8px}
.nr button{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--slate-d)}
.nr button:hover:not(:disabled){border-color:var(--grey)}
.nr button:disabled{opacity:.35;cursor:default}
.nr-l{text-align:center;line-height:1.25}
.nr-l small{display:block;font-size:13px;color:var(--muted)}
.nr-l b{font-size:16px;font-weight:700}
.phone{width:360px;height:740px;background:var(--frame);border-radius:50px;padding:9px;box-shadow:0 34px 60px -24px rgba(30,37,41,.5),inset 0 0 0 1.5px #4A555C}
.scr{position:relative;width:100%;height:100%;background:#fff;border-radius:41px;overflow:hidden;overflow:clip;display:flex;flex-direction:column;isolation:isolate}
.sbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 28px 0 32px;font-size:14px;font-weight:700;position:relative;z-index:3}
.sbar::after{content:'';position:absolute;left:50%;top:10px;transform:translateX(-50%);width:92px;height:26px;background:var(--frame);border-radius:14px}
.sbar .si{display:flex;gap:6px;align-items:center}
.sbar.lt{color:#fff}
.ct{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.ct::-webkit-scrollbar{display:none}
.ct.enter{animation:fade .16s ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.ft{flex:none;padding:10px 16px 12px;border-top:1px solid var(--line);background:#fff;display:flex;gap:10px;align-items:center}
.ft.col{flex-direction:column;align-items:stretch}
.tb{flex:none;height:68px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px 14px;background:#fff}
.tb button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#8D969C;position:relative;border-radius:10px}
.tb button[aria-current=page]{color:var(--red)}
.tb .pl{width:42px;height:34px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center}
.tb button.plusb{font-size:0;gap:0}
.tb .bd{position:absolute;top:0;left:calc(50% + 4px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.dr{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:360px}
.dr button{width:9px;height:9px;border-radius:5px;background:#C2C8CC;transition:width .2s}
.dr button:hover{background:var(--grey)}
.dr button[aria-current=true]{width:24px;background:var(--red)}

.panel{width:340px;background:#fff;border-radius:22px;padding:24px 22px 20px;position:sticky;top:22px;max-height:calc(100vh - 44px);overflow:auto;scrollbar-width:thin}
.panel .ph{display:flex;align-items:center;gap:12px}
.panel .ph img{width:44px;height:auto}
.panel h2{font-size:21px;font-weight:800;line-height:1.15}

.ck{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--fog)}
.ck b{display:block;font-size:15.5px;line-height:1.25}
.box{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;font-size:15px;line-height:1.4}
.box svg{color:var(--slate);margin-top:1px}
.rad{display:flex;flex-direction:column;gap:8px}
.rad label{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;font-weight:600;font-size:15.5px}
.rad label:has(input:checked){border-color:var(--slate-d);background:#FAFBFB}
.rad input{width:19px;height:19px;accent-color:var(--red)}
.rad label svg{margin-left:auto;color:var(--slate)}
.sum{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:15.5px}
.sum dt{color:var(--muted)}
.sum dd{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:800;color:var(--ink);font-size:18px;padding-top:10px;border-top:1px solid var(--line)}
.fine{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.4}
.rcpt{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:15px;padding:16px;border-radius:16px;background:var(--fog);margin-top:20px;text-align:left}
.rcpt dt{color:var(--muted)}.rcpt dd{font-weight:600;text-align:right}

.sin{display:flex;justify-content:center;gap:6px;margin-top:20px}
.sin button{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:#D7DBDE}
.sin button.on{color:#E8A317}
.sin button:hover{background:var(--fog)}
.slbl{text-align:center;font-weight:700;margin-top:8px;font-size:15.5px;min-height:22px}

.phg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pht{aspect-ratio:1;border-radius:12px;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.pht small{position:absolute;bottom:6px;left:8px;font-size:11.5px;font-weight:700}
.pht .rm{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.pht .cvr{position:absolute;top:6px;left:6px;background:#fff;color:var(--ink);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px}
.phadd{text-align:center;aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--grey);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--slate);font-size:12.5px;font-weight:700}
.phadd:hover{border-color:var(--slate);background:var(--fog)}
.payout{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--fog);font-size:14.5px;line-height:1.45;color:var(--slate-d)}
.payout b{color:var(--ink)}
.cpy{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--warn-s)}
.cpy .cb{margin-top:0;color:#5A3D00}

.mi{padding:14px 0;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi-t{display:flex;gap:12px;align-items:center;width:100%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fog);border-radius:11px;padding:3px;margin-top:12px}
.seg button{height:34px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(30,37,41,.15)}
.mi-a{display:flex;gap:18px;margin-top:10px;align-items:center}
.mi-n{font-size:13.5px;color:var(--ok);font-weight:700;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles div{background:var(--fog);border-radius:14px;padding:12px 10px}
.tiles small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.2}
.tiles b{display:block;font-size:17px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.txi{padding:14px 0;border-bottom:1px solid var(--line)}
.txi:last-child{border-bottom:0}
.txi .r{display:flex;gap:12px;align-items:center}
.txi .r .m{flex:1;min-width:0}
.txi .r .m b{display:block;font-size:15px;line-height:1.25}
.txi .r .m small{font-size:13px;color:var(--muted)}
.txi .amt{flex:none;font-weight:800;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.txi .amt.pos{color:var(--ok)}
.txi .brk{font-size:13px;color:var(--muted);margin:8px 0 0 66px;line-height:1.4}
.txi .act{margin:8px 0 0 66px}
.kind{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--fog);color:var(--slate-d);margin-right:4px}

.pfc{display:flex;gap:14px;align-items:center;padding:4px 20px 0}
.pfc h2{font-size:21px;font-weight:800;line-height:1.2}
.pfc p{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35}
.kp{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 20px 0;border:1.5px solid var(--line);border-radius:16px}
.kp div{text-align:center;padding:12px 6px}
.kp div+div{border-left:1.5px solid var(--line)}
.kp b{display:block;font-size:20px;font-weight:800}
.kp small{font-size:12.5px;color:var(--muted);font-weight:600}
.menu{margin:14px 20px 0}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.menu button:last-child{border-bottom:0}
.menu button .mi-ic{width:36px;height:36px;border-radius:11px;background:var(--fog);display:grid;place-items:center;color:var(--slate-d)}
.menu button span.l{flex:1}
.menu button small{font-size:13px;color:var(--muted);font-weight:600}
.menu button.out{color:var(--red)}.menu button.out .mi-ic{background:var(--red-s);color:var(--red)}
.avsel{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.avsel button.sw{width:32px;height:32px;border-radius:50%}
.avsel button.sw[aria-pressed=true]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--slate-d)}

.rm-card{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.rm-card h3{font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.rm-card ul{list-style:none;margin-top:8px}
.rm-card li{display:flex;gap:10px;padding:8px 0;font-size:14.5px;line-height:1.4;border-top:1px solid var(--line)}
.rm-card li:first-child{border-top:0}
.rm-card li .ri{width:32px;height:32px;border-radius:10px;background:var(--fog);display:grid;place-items:center;color:var(--slate-d);flex:none}
.rm-card li b{display:block;font-size:15px}
.rm-card li small{color:var(--muted);font-size:13.5px}
.rm-card.live{background:var(--ok-s);border-color:transparent}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--fog);font-weight:600;font-size:15px}
.sw2{width:48px;height:28px;border-radius:14px;background:#C9CED1;position:relative;transition:background .2s;flex:none}
.sw2::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw2[aria-checked=true]{background:var(--ok)}
.sw2[aria-checked=true]::after{left:23px}

.ov{position:absolute;inset:0;background:rgba(30,37,41,0);z-index:20;display:flex;align-items:flex-end;transition:background .2s}
.ov.open{background:rgba(30,37,41,.45)}
.sh{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:8px 20px 22px;max-height:88%;overflow:auto;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.3,1);scrollbar-width:none}
.ov.open .sh{transform:none}
.sh::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between}
.sh-h h2{font-size:20px;font-weight:800}
.sh h3{font-size:14.5px;font-weight:700;color:var(--slate-d);margin:16px 0 8px}
.sh-f{display:flex;gap:10px;margin-top:20px}
.sh-f .btn.sec{flex:0 0 auto;padding:0 18px}
.ov.mid{align-items:center;justify-content:center;padding:24px}
.dlg{background:#fff;border-radius:22px;padding:22px 20px 18px;width:100%;transform:scale(.94);opacity:0;transition:.18s}
.ov.open .dlg{transform:none;opacity:1}
.dlg h2{font-size:19px;font-weight:800}
.dlg p{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.45}
.dlg .sh-f{margin-top:18px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:600;z-index:30;display:flex;gap:10px;align-items:center;animation:tin .25s ease-out;line-height:1.35}
.toast svg{color:#7FD3A8}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btnrow{display:flex;gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="stage">
  <div class="dev" id="dev">
    <div class="nr">
      <button id="prev" onclick="A.step(-1)" aria-label="Vorheriger Screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="nr-l" aria-live="polite"><small id="nrn"></small><b id="nrt"></b></div>
      <button id="next" onclick="A.step(1)" aria-label="Nächster Screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="phone"><div class="scr" id="scr"></div></div>
    <div class="dr" id="dots" role="group" aria-label="Screens"></div>
  </div>
  <aside class="panel" id="panel" aria-label="MVP-Abdeckung"></aside>
</div>

const L = id => S.listings.find(l => l.id === id);
const meU = () => ({name: `${S.me.first} ${S.me.last.charAt(0)}.`, full:`${S.me.first} ${S.me.last}`, course:S.me.course, sem:S.me.sem, campus:S.me.campus, color:S.me.color, photo:S.me.photo, dist:S.me.dist});
const U = id => id === 'me' ? meU() : S.users[id];
const rating = u => { const c = u.dist.reduce((a, b) => a + b, 0); const s = u.dist.reduce((a, b, i) => a + b * (i + 1), 0); return {c, avg: c ? s / c : 0}; };
const fmtAvg = a => a.toFixed(1).replace('.', ',');
const priceFor = l => S.agreed[l.id] ?? l.price;
const chatFor = lid => S.chats.find(c => c.lid === lid);

function av(u, s = 44){
  const ini = u.name.split(' ').map(x => x[0]).join('').slice(0, 2);
  return `<span class="av${u.photo ? ' photo' : ''}" style="width:${s}px;height:${s}px;background:${u.color};font-size:${Math.round(s * .38)}px">${u.photo ? I('user', Math.round(s * .55), 1.6) : esc(ini)}</span>`;
}
function stars(avg, s = 14){
  let h = '<span class="stars" aria-hidden="true">';
  for (let i = 1; i <= 5; i++) h += `<span class="${i <= Math.round(avg) ? 'on' : ''}">${I('star', s)}</span>`;
  return h + '</span>';
}
function rt(u){ const r = rating(u); return `<span class="rt">${stars(r.avg)}<b>${fmtAvg(r.avg)}</b> (${r.c})</span>`; }
const vb = (t = 'Verifiziert') => `<span class="vb">${I('shield', 15, 2)}${t}</span>`;
function pill(l){ return l.status === 'aktiv' ? '' : `<span class="pill ${l.status}">${l.status === 'reserviert' ? 'Reserviert' : 'Verkauft'}</span>`; }
function pillAll(l){ return `<span class="pill ${l.status}">${{aktiv:'Aktiv',reserviert:'Reserviert',verkauft:'Verkauft'}[l.status]}</span>`; }
function cover(l, sz = 's'){
  const obj = l.cat !== 'buecher';
  return `<span class="cv ${sz}${obj ? ' obj' : ''}" style="background:${l.color}"><span class="ic">${I(CATS[l.cat].icon, obj ? (sz === 'l' ? 64 : sz === 'm' ? 44 : 26) : (sz === 's' ? 22 : 16), 1.6)}</span>${obj ? '' : `<b>${esc(l.title)}</b><small>${esc(l.sub)}</small>`}</span>`;
}
function meta(l){ return l.course ? `${l.course}, ${l.sem}. Semester` : CATS[l.cat].label; }
function lrow(l){
  return `<button class="lr" onclick="A.open('${l.id}')">${cover(l)}<span class="lr-b"><b>${esc(l.title)}</b><small>${esc(meta(l))}, ${esc(l.cond)}</small><span class="lr-p">${price(l.price)} ${pill(l)}</span></span>${I('chev', 18)}</button>`;
}
function hd(title, o = {}){
  const b = o.back === false ? '' : `<button class="ib" onclick="A.back()" aria-label="Zurück">${I('back', 22, 2.2)}</button>`;
  return `<header class="hd${o.sm ? ' sm' : ''}${o.back === false ? ' top' : ''}">${b}<h1>${title}</h1>${o.action || ''}</header>`;
}
function sel(id, opts, val, attrs = ''){
  return `<select class="in" id="${id}" ${attrs}>${opts.map(o => { const [v, t, dis] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${String(v) === String(val) ? ' selected' : ''}${dis ? ' disabled' : ''}>${esc(t)}</option>`; }).join('')}</select>`;
}
const semOpts = (first) => [[ '', first ], ...[1,2,3,4,5,6].map(n => [String(n), `${n}. Semester`])];
function empty(icon, title, text, btn = ''){ return `<div class="empty"><div class="eic">${I(icon, 26)}</div><b>${title}</b>${text}${btn}</div>`; }

function results(f){
  const toks = norm(f.q).split(/\s+/).filter(Boolean);
  const r = S.listings.filter(l => {
    if (l.seller === 'me') return false;
    if (f.hideSold && l.status === 'verkauft') return false;
    if (f.cat && l.cat !== f.cat) return false;
    if (f.min !== '' && l.price < +f.min) return false;
    if (f.max !== '' && l.price > +f.max) return false;
    if (f.conds.length && !f.conds.includes(l.cond)) return false;
    if (f.course && l.course !== f.course) return false;
    if (f.sem && l.sem !== +f.sem) return false;
    if (toks.length){ const hay = norm([l.title, l.sub, l.desc, l.course, CATS[l.cat].label].join(' ')); if (!toks.every(t => hay.includes(t))) return false; }
    return true;
  });
  if (f.sort === 'preis') r.sort((a, b) => a.price - b.price);
  else if (f.sort === 'preis-') r.sort((a, b) => b.price - a.price);
  else r.sort((a, b) => b.created - a.created);
  return r;
}
function fCount(f){ return (f.cat ? 1 : 0) + (f.min !== '' || f.max !== '' ? 1 : 0) + f.conds.length + (f.course ? 1 : 0) + (f.sem ? 1 : 0); }
function activeChips(){
  const f = S.f, c = [];
  if (f.cat) c.push([CATS[f.cat].label, 'cat']);
  if (f.min !== '' || f.max !== '') c.push([f.min !== '' && f.max !== '' ? `${f.min} bis ${f.max} €` : f.min !== '' ? `ab ${f.min} €` : `bis ${f.max} €`, 'price']);
  f.conds.forEach(x => c.push([x, 'cond:' + x]));
  if (f.course) c.push([f.course, 'course']);
  if (f.sem) c.push([`${f.sem}. Semester`, 'sem']);
  return c.map(([t, k]) => `<button class="chip x" onclick="A.rmF('${k}')" aria-label="Filter ${esc(t)} entfernen">${esc(t)} ${I('x', 15, 2.2)}</button>`).join('');
}
function fillRes(){
  const r = results(S.f);
  if ($('rc')) $('rc').textContent = r.length === 1 ? '1 Treffer' : `${r.length} Treffer`;
  if ($('res')) $('res').innerHTML = r.length ? r.map(lrow).join('') : empty('search', S.f.q ? `Keine Treffer für „${esc(S.f.q)}“` : 'Keine Treffer', 'Versuche es mit einem Fach oder Titel, oder entferne einen Filter.', fCount(S.f) || S.f.q ? `<button class="btn sec sm" onclick="A.clearF()">Suche zurücksetzen</button>` : '');
}

function msgH(c, m, i){
  const own = L(c.lid) && L(c.lid).seller === 'me';

    return `<div class="pc ${m.f}"><span class="h">${I('euro', 15)}Preisvorschlag</span><div class="v">${euro(m.v)}</div><div class="s ${m.s}">${st}</div>${canAccept ? `<div class="btnrow"><button class="btn sm sec" onclick="A.decline(${i})">Ablehnen</button><button class="btn sm" onclick="A.accept(${i})">Annehmen</button></div>` : ''}</div>`;

function toast(m){

function overlay(html, mid){
  closeOv();
  const o = document.createElement('div'); o.className = 'ov' + (mid ? ' mid' : ''); o.id = 'ov';
  o.innerHTML = html;
  o.addEventListener('click', e => { if (e.target === o) closeOv(); });
  $('scr').appendChild(o);
  requestAnimationFrame(() => o.classList.add('open'));
  setTimeout(() => { const f = o.querySelector('input,button.btn,button'); f && f.focus({preventScroll:true}); }, 60);
}
function closeOv(){ const o = $('ov'); if (o) o.remove(); }
function sheet(title, body){ overlay(`<div class="sh" role="dialog" aria-modal="true" aria-label="${title}"><div class="sh-h"><h2>${title}</h2><button class="ib" onclick="A.close()" aria-label="Schließen">${I('x', 22)}</button></div><div id="shb">${body}</div></div>`); }

const A = {

  login(){

    if (!c){ const l = L(lid); c = {id:'c' + Date.now(), lid, with:l.seller, unread:0, step:0, ts:Date.now(), msgs:[]}; S.chats.push(c); }
    go('chat', {cid:c.id});
    if (!c.msgs.length) setTimeout(() => { const i = $('mi'); if (i){ i.value = `Hallo, ist „${L(lid).title}“ noch zu haben?`; i.focus(); } }, 60);
  },
  send(){
    const i = $('mi'), v = i.value.trim(); if (!v) return;
    const c = curChat(); c.msgs.push({f:'me', t:'text', x:v}); c.ts = Date.now(); i.value = ''; renderMsgs(c);
    const r = REPLIES[c.step % REPLIES.length]; c.step++;
    reply(c, () => c.msgs.push({f:'them', t:'text', x:r}));
  },
  offerSheet(){
    const l = L(curChat().lid);
    sheet('Preis vorschlagen', `<p class="tx" style="margin-top:4px">Angebotspreis ${price(l.price)}. Wird dein Vorschlag angenommen, gilt er automatisch beim Kauf.</p>
      <label class="fl"><span>Dein Vorschlag</span><span class="suf"><input class="in" id="ov-v" inputmode="decimal" value="${String(Math.round(l.price * .9)).replace('.', ',')}"><i>€</i></span><small class="err" id="ov-e"></small></label>
      <div class="sh-f"><button class="btn" onclick="A.sendOffer()">Vorschlag senden</button></div>`);
  },
  sendOffer(){
    const c = curChat(), l = L(c.lid), v = parseFloat($('ov-v').value.replace(',', '.'));
    if (!(v > 0) || v > l.price){ $('ov-e').textContent = `Gib einen Betrag zwischen 1 € und ${price(l.price)} ein.`; return; }
    closeOv(); const m = {f:'me', t:'offer', v:r2(v), s:'offen'}; c.msgs.push(m); c.ts = Date.now(); renderMsgs(c);
    reply(c, () => {
      if (v >= l.price * .85){ m.s = 'ok'; S.agreed[l.id] = r2(v); c.msgs.push({f:'them', t:'text', x:`Einverstanden, ${euro(v)} passt für mich.`}); }
      else { m.s = 'no'; const cv = Math.ceil(l.price * .9); c.msgs.push({f:'them', t:'text', x:'Das ist mir etwas zu wenig. Wie wäre es damit?'}, {f:'them', t:'offer', v:cv, s:'offen'}); }
    }, 1600);
  },
  accept(i){
    const c = curChat(), m = c.msgs[i], l = L(c.lid); m.s = 'ok'; S.agreed[l.id] = m.v;
    if (l.seller === 'me' && l.status === 'aktiv') l.status = 'reserviert';
    c.msgs.push({f:'me', t:'text', x:'Passt, abgemacht!'}); c.ts = Date.now(); renderMsgs(c); toast(`Preis von ${euro(m.v)} vereinbart`);
    if (l.seller === 'me') reply(c, () => c.msgs.push({f:'them', t:'text', x:'Cool, danke! Wann und wo passt es dir?'}));
  },
  decline(i){ const c = curChat(); c.msgs[i].s = 'no'; c.msgs.push({f:'me', t:'text', x:'Da gehe ich leider nicht ganz mit.'}); renderMsgs(c); },
  meetSheet(){
    sheet('Treffpunkt vorschlagen', `<h3>Ort</h3><div class="rad">${PLACES.map((p, i) => `<label><input type="radio" name="mp" value="${i}" ${i === 0 ? 'checked' : ''}>${p}</label>`).join('')}</div>
      <h3>Zeit</h3><div class="rad">${TIMES.map((t, i) => `<label><input type="radio" name="mt" value="${i}" ${i === 1 ? 'checked' : ''}>${t}</label>`).join('')}</div>
      <div class="sh-f"><button class="btn" onclick="A.sendMeet()">Vorschlag senden</button></div>`);
  },
  sendMeet(){
    const p = PLACES[+document.querySelector('input[name=mp]:checked').value], t = TIMES[+document.querySelector('input[name=mt]:checked').value];
    const c = curChat(), m = {f:'me', t:'meet', p, tm:t, s:'offen'}; closeOv(); c.msgs.push(m); c.ts = Date.now(); renderMsgs(c);
    reply(c, () => { m.s = 'ok'; S.meet[c.lid] = {p, tm:t}; c.msgs.push({f:'them', t:'text', x:'Passt, ich bin da!'}); }, 1400);
  },

  
  buy(id){ go('checkout', {id}); },
  pay(id){
    const b = $('paybtn'); b.classList.add('load'); b.innerHTML = '<span class="spin"></span>Zahlung wird verarbeitet';
    setTimeout(() => {
      const l = L(id), pr = priceFor(l), mt = S.meet[id];
      const t = {id:'t' + Date.now(), kind:'kauf', lid:id, price:pr, with:l.seller, date:today(), method:S.pm, rated:false, no:'ST-2026-0' + (140 + S.tx.length), meet: mt ? `${mt.p}, ${mt.tm}` : ''};
      S.tx.push(t); l.status = 'verkauft';
      if (cur === 'checkout') go('paid', {tx:t.id}, {replace:true});
    }, 1500);
  },
  star(n){
    S.rs = n;
    for (let i = 1; i <= 5; i++){ const b = $('s' + i); b.classList.toggle('on', i <= n); b.setAttribute('aria-checked', i === n); }
    $('slbl').textContent = SL[n]; $('rbtn').disabled = false;
  },
  submitRate(){
    const t = S.tx.find(x => x.id === P.tx), u = U(t.with), n = S.rs;
    u.dist[n - 1]++; t.rated = true; t.stars = n;
    go('seller', {uid:t.with}, {replace:true});
    toast('Bewertung veröffentlicht');
    setTimeout(() => { S.me.dist[4]++; toast(`${u.name} hat dich ebenfalls bewertet: 5 Sterne`); if (cur === 'profile' || (cur === 'seller' && P.uid === 'me')) render(); }, 3200);
  },

  
  addPhoto(){ if (S.draft.photos < 5){ S.draft.photos++; A.phR(); } },
  rmPhoto(i){ S.draft.photos--; A.phR(); },
  phR(){ $('phg').innerHTML = photoGrid(); $('phc').textContent = `${S.draft.photos} von 5`; $('e-photos').textContent = ''; },
  dCat(v){ S.draft.cat = v; $('cpy').hidden = v !== 'buecher'; A.phR(); },
  dCond(c){ S.draft.cond = c; document.querySelectorAll('#d-cond .chip').forEach(b => { const on = b.textContent === c; b.setAttribute('aria-pressed', on); b.setAttribute('aria-checked', on); }); $('e-cond').textContent = ''; },
  publish(){
    const d = S.draft, v = parseFloat(String(d.price).replace(',', '.')), errs = {};
    if (d.photos < 1) errs.photos = 'Füge mindestens ein Foto hinzu.';
    if (d.title.trim().length < 3) errs.title = 'Der Titel braucht mindestens 3 Zeichen.';
    if (!d.cond) errs.cond = 'Wähle den Zustand aus.';
    if (!(v > 0) || v > 2000) errs.price = 'Gib einen Preis zwischen 0,01 € und 2.000 € ein.';
    if (d.desc.trim().length < 10) errs.desc = 'Beschreibe den Artikel in mindestens 10 Zeichen.';
    if (d.cat === 'buecher' && !d.cpy) errs.cpy = 'Bitte bestätige den Hinweis zum Urheberrecht.';
    ['photos','title','cond','price','desc','cpy'].forEach(k => { $('e-' + k).textContent = errs[k] || ''; const inp = $('d-' + k); if (inp) inp.classList.toggle('bad', !!errs[k]); });
    const first = Object.keys(errs)[0];
    if (first){ const el = $('e-' + first); el.closest('.fl, .cpy, .pad') && el.scrollIntoView({block:'center', behavior:'smooth'}); return; }
    const data = {title:d.title.trim(), cat:d.cat, course:d.course, sem:d.sem ? +d.sem : 0, cond:d.cond, price:r2(v), desc:d.desc.trim(), photos:d.photos};
    if (S.draftEdit){
      const l = L(S.draftEdit); Object.assign(l, data); S.draft = null; S.draftEdit = null;
      A.back(); toast('Änderungen gespeichert');
    } else {
      const cols = COLORS[d.cat];
      const l = Object.assign({id:'n' + Date.now(), sub: d.cat === 'buecher' ? 'Eigenes Inserat' : CATS[d.cat].label, seller:'me', status:'aktiv', color:cols[Math.floor(Math.random() * cols.length)], created:Date.now()}, data);
      S.listings.push(l); S.draft = null;
      go('detail', {id:l.id}, {replace:true}); toast('Inserat veröffentlicht');
    }
  },
  ce(k){ const e = $('e-' + k); if (e) e.textContent = ''; const i = $('d-' + k); if (i) i.classList.remove('bad'); },
  edit(id){ S.draftEdit = null; go('sell', {edit:id}); },
  setStatus(id, s){ const l = L(id); if (l.status === s) return; l.status = s; render(); toast({aktiv:'Wieder als aktiv markiert', reserviert:'Als reserviert markiert', verkauft:'Als verkauft markiert'}[s]); },
  del(id){ const l = L(id); confirmDlg('Inserat löschen?', `„${esc(l.title)}“ wird dauerhaft entfernt. Das kannst du nicht rückgängig machen.`, 'Löschen', () => { S.listings = S.listings.filter(x => x.id !== id); render(); toast('Inserat gelöscht'); }); },

  
  epColor(c){ S.ep = {color:c, photo:false}; A.epR(); },
  epPhoto(){ S.ep.photo = true; A.epR(); toast('Foto hochgeladen'); },
  epR(){ $('epav').innerHTML = av(Object.assign(meU(), S.ep), 72); document.querySelectorAll('.avsel .sw').forEach(b => b.setAttribute('aria-pressed', !S.ep.photo && b.style.background && b.getAttribute('aria-label') === 'Farbe ' + S.ep.color)); },
  saveProfile(){
    const f = $('ep-f').value.trim(), l = $('ep-l').value.trim();
    if (!f || !l){ $('ep-e').textContent = 'Vor- und Nachname dürfen nicht leer sein.'; return; }
    Object.assign(S.me, {first:f, last:l, course:$('ep-c').value, sem:+$('ep-s').value, campus:$('ep-k').value, color:S.ep.color, photo:S.ep.photo});
    A.back(); toast('Profil gespeichert');
  },
  notify(b){ S.notify = !S.notify; b.setAttribute('aria-checked', S.notify); toast(S.notify ? 'Wir sagen dir Bescheid, sobald es losgeht' : 'Benachrichtigung ausgeschaltet'); }
};
window.A = A;

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('ov')) return closeOv();
  const t = e.target.tagName;
  if (['INPUT','TEXTAREA','SELECT'].includes(t)) return;
  if (e.key === 'ArrowRight') A.step(1);
  if (e.key === 'ArrowLeft') A.step(-1);
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute('role') === 'button' && t !== 'BUTTON'){ e.preventDefault(); e.target.click(); }
});
function fit(){
  const z = Math.min(1, (innerHeight - 20) / 860, (innerWidth - 24) / 360);
  $('dev').style.zoom = Math.max(.55, z);
}
addEventListener('resize', fit); fit();
render();
</script>
</body>
</html>
